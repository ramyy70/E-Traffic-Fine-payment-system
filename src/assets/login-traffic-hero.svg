<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Traffic compliance illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2447"/>
      <stop offset="0.55" stop-color="#15427F"/>
      <stop offset="1" stop-color="#0E5F7D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="900" rx="48" fill="url(#bg)"/>

  <!-- soft glows -->
  <circle cx="170" cy="180" r="140" fill="#67E8F9" fill-opacity="0.16" filter="url(#blur)"/>
  <circle cx="1040" cy="120" r="170" fill="#60A5FA" fill-opacity="0.14" filter="url(#blur)"/>
  <circle cx="650" cy="860" r="220" fill="#1D4ED8" fill-opacity="0.18" filter="url(#blur)"/>

  <!-- card / glass -->
  <g opacity="0.95">
    <rect x="96" y="130" width="1008" height="640" rx="36" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="132" y="172" width="476" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="132" y="256" width="380" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="132" y="286" width="320" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="132" y="312" width="280" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.10"/>
  </g>

  <!-- Road -->
  <path d="M720 770C830 650 930 565 1104 520V770H720Z" fill="#FFFFFF" fill-opacity="0.06"/>
  <path d="M740 770C845 665 950 590 1104 552" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <path d="M846 742C922 664 1010 610 1104 582" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 10"/>

  <!-- Shield -->
  <g transform="translate(720 220)">
    <path d="M168 18c-34 22-74 34-120 38v106c0 78 54 144 120 170 66-26 120-92 120-170V56c-46-4-86-16-120-38Z" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M132 168l-24-24-14 14 38 38 70-70-14-14-56 56Z" fill="#7BE4DA"/>
  </g>

  <!-- Police car (simple) -->
  <g transform="translate(690 470)">
    <rect x="70" y="90" width="340" height="110" rx="28" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <path d="M120 90c18-38 40-62 84-62h126c36 0 60 22 82 62H120Z" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <rect x="258" y="44" width="82" height="44" rx="14" fill="#7BE4DA" fill-opacity="0.24" stroke="#7BE4DA" stroke-opacity="0.35"/>
    <rect x="156" y="108" width="136" height="50" rx="16" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="150" cy="210" r="26" fill="#0F172A" fill-opacity="0.55" />
    <circle cx="350" cy="210" r="26" fill="#0F172A" fill-opacity="0.55" />
    <circle cx="150" cy="210" r="12" fill="#FFFFFF" fill-opacity="0.22" />
    <circle cx="350" cy="210" r="12" fill="#FFFFFF" fill-opacity="0.22" />
    <rect x="104" y="152" width="110" height="10" rx="5" fill="#7BE4DA" fill-opacity="0.75"/>
    <rect x="226" y="152" width="140" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.25"/>
    <rect x="200" y="4" width="80" height="30" rx="10" fill="#60A5FA" fill-opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="212" y="10" width="26" height="18" rx="6" fill="#F87171" fill-opacity="0.55"/>
    <rect x="242" y="10" width="26" height="18" rx="6" fill="#60A5FA" fill-opacity="0.55"/>
  </g>

  <!-- data nodes -->
  <g opacity="0.9">
    <circle cx="836" cy="404" r="6" fill="#7BE4DA"/>
    <circle cx="948" cy="358" r="6" fill="#60A5FA"/>
    <circle cx="1032" cy="420" r="6" fill="#7BE4DA"/>
    <path d="M836 404c32-28 70-44 112-46" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
    <path d="M948 358c32 0 62 20 84 62" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
