<svg width="900" height="620" viewBox="0 0 900 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Official crest illustration">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2447"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="620" rx="36" fill="url(#paper)"/>

  <!-- subtle background pattern -->
  <circle cx="140" cy="130" r="90" fill="#22D3EE" fill-opacity="0.16" filter="url(#soft)"/>
  <circle cx="780" cy="110" r="110" fill="#60A5FA" fill-opacity="0.14" filter="url(#soft)"/>
  <circle cx="650" cy="560" r="130" fill="#0EA5E9" fill-opacity="0.18" filter="url(#soft)"/>

  <!-- header bar -->
  <rect x="44" y="44" width="812" height="84" rx="22" fill="url(#maroon)"/>
  <rect x="44" y="44" width="812" height="84" rx="22" stroke="#38BDF8" stroke-opacity="0.25"/>

  <!-- emblem (stylized) -->
  <g transform="translate(86 64)">
    <circle cx="34" cy="34" r="34" fill="url(#gold)"/>
    <circle cx="34" cy="34" r="26" fill="#0B2447" fill-opacity="0.9"/>
    <path d="M22 42c8-3 16-12 18-22 2 10 10 19 18 22-7 6-13 9-18 9s-11-3-18-9Z" fill="#F8FAFC" fill-opacity="0.92"/>
  </g>

  <!-- header text blocks -->
  <rect x="170" y="70" width="260" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="170" y="94" width="360" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.75"/>

  <!-- main card -->
  <rect x="44" y="156" width="812" height="420" rx="28" fill="#020617" fill-opacity="0.35" stroke="#38BDF8" stroke-opacity="0.35"/>

  <!-- seal / shield -->
  <g transform="translate(330 210)">
    <path d="M120 22c-34 22-72 34-120 38v110c0 78 54 146 120 172 66-26 120-94 120-172V60c-48-4-86-16-120-38Z" fill="#0F172A" fill-opacity="0.04" stroke="#0F172A" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M120 60c-26 16-56 26-92 30v76c0 56 38 104 92 122 54-18 92-66 92-122V90c-36-4-66-14-92-30Z" fill="url(#gold)" fill-opacity="0.9"/>
    <path d="M88 170l-16-16-10 10 26 26 52-52-10-10-42 42Z" fill="#E0F2FE"/>
  </g>

  <!-- footer info rows -->
  <rect x="92" y="414" width="716" height="14" rx="7" fill="#E5F3FF" fill-opacity="0.18"/>
  <rect x="92" y="442" width="640" height="12" rx="6" fill="#E5F3FF" fill-opacity="0.16"/>
  <rect x="92" y="468" width="560" height="12" rx="6" fill="#E5F3FF" fill-opacity="0.14"/>

  <!-- small trust chips -->
  <g transform="translate(92 504)">
    <rect x="0" y="0" width="186" height="44" rx="14" fill="#0B2447" fill-opacity="0.45" stroke="#38BDF8" stroke-opacity="0.4"/>
    <rect x="206" y="0" width="206" height="44" rx="14" fill="#0B2447" fill-opacity="0.45" stroke="#38BDF8" stroke-opacity="0.4"/>
    <rect x="432" y="0" width="176" height="44" rx="14" fill="#0B2447" fill-opacity="0.45" stroke="#38BDF8" stroke-opacity="0.4"/>
  </g>
</svg>
